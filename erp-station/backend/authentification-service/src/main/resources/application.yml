server:
  port: 8081

spring:
  application:
    name: authentification-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/db_auth
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html

security:
  jwt:
    # Meme cle que gateway-service (qui verifie les tokens). A changer en production via JWT_SECRET.
    secret: ${JWT_SECRET:c3RhdGlvbi1zZXJ2aWNlLWVycC1lbXNpLXBmYS0yMDI2LXNlY3JldC1rZXktMjU2Yml0cw==}
    expiration-minutes: 480
